[package]
name = "wcm-hello"
description = "Windows Hello (KeyCredentialManager) key-slot backend for wcm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
test-util = ["dep:rsa", "dep:sha2", "wcm-core/test-util"]

[dependencies]
wcm-core.workspace = true
serde.workspace = true
zeroize.workspace = true
rand.workspace = true
rsa = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Security_Cryptography_Core",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_RemoteDesktop",
  "Win32_Security_Cryptography",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rsa.workspace = true
sha2.workspace = true
wcm-core = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
