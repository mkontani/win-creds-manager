# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)
# Run locally with: cargo install cargo-deny && cargo deny check

[graph]
# Check every target we ship or cross-check for; Windows-only dependencies
# (windows-*, clipboard-win, ...) are included this way.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities fail the check; unmaintained / unsound / notices only warn.
version = 2
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071 (Marvin attack): timing side channel in RSA *private-key*
    # operations of the `rsa` crate. wcm only uses `rsa` to verify the Windows
    # Hello signature with the *public* key (rsa::pkcs1v15::VerifyingKey); the
    # private key lives in the TPM/NGC and is never handled by this crate.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for public-key signature verification only" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
]
# Crates whose license metadata cargo-deny cannot infer from the manifest.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# RustCrypto digest-0.10 line must not be mixed with the 0.11 line (see Cargo.toml).
deny = [
    { crate = "sha2@0.11", reason = "digest 0.11 line; workspace pins sha2 0.10" },
    { crate = "hkdf@0.13", reason = "digest 0.11 line; workspace pins hkdf 0.12" },
    { crate = "rand@0.9", reason = "workspace pins rand 0.8 (rsa/argon2 compatibility)" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
